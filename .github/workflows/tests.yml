name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Login shell so the conda environment is active in every step.
        shell: bash -el {0}
    env:
      # A missing dependency is a failure in CI, not a skip.
      HYPEROSD_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up the conda environment (environment.yaml)
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yaml
          activate-environment: hyperOSD
          auto-activate: false

      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Versions
        run: |
          python --version
          python -c "import pyvips, numpy; print('libvips', pyvips.version(0), pyvips.version(1), pyvips.version(2)); print('numpy', numpy.__version__)"

      - name: Static host checks
        run: python -m unittest -v tests.test_static_hosts

      - name: DZI pipeline
        run: python -m unittest -v tests.test_dzi_pipeline

      - name: Demo dataset
        run: python -m unittest -v tests.test_demo_data

      - name: Viewer smoke test (headless Chromium, software WebGL)
        run: python -m unittest -v tests.test_viewer_smoke
